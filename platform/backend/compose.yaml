services:
  athenasec-agent:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: athenasec-agent

    ports:
      - "8000:8000"

    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      # The app defaults to postgres when this is unset, which fails without
      # ATHENASEC_DATABASE_URL. This file mounts ./data for SQLite, so say so.
      # For PostgreSQL: set ATHENASEC_PERSISTENCE_BACKEND=postgres and
      # ATHENASEC_DATABASE_URL in the shell or an env file.
      ATHENASEC_PERSISTENCE_BACKEND: ${ATHENASEC_PERSISTENCE_BACKEND:-sqlite}
      ATHENASEC_DATABASE_URL: ${ATHENASEC_DATABASE_URL:-}
      ATHENASEC_DB_PATH: /app/data/athenasec.db

    volumes:
      - ./data:/app/data

    restart: unless-stopped