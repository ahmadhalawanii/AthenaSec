#!/usr/bin/env bash

# AthenaSec Secret Inventory
#
# IMPORTANT:
# This file contains ONLY secret locations and identifiers.
# It must NEVER contain actual passwords, API keys, tokens, or other
# credential values.
#
# Actual secrets are stored under:
#   /etc/athenasec/secrets/
#
# Secret files are expected to be:
#   owner: root
#   group: root
#   mode:  600


# ------------------------------------------------------------------
# Wazuh
# ------------------------------------------------------------------

# Existing/current Wazuh administrator credential.
# The current development installation still uses the old password-tool
# output file and will be migrated later.
WAZUH_ADMIN_SECRET="wazuh/admin-password"

# Future credential used by the AthenaSec backend to communicate with
# Wazuh. The exact authentication mechanism will be finalized when
# wazuh.sh automation is implemented.
WAZUH_ATHENASEC_SERVICE_SECRET="wazuh/athenasec-service-credential"


# ------------------------------------------------------------------
# Cortex
# ------------------------------------------------------------------

# Password used by Cortex to authenticate to its Elasticsearch instance.
CORTEX_ELASTICSEARCH_PASSWORD="cortex/elasticsearch-password"

# Cortex-generated API key used by AthenaSec to communicate with Cortex.
CORTEX_ATHENASEC_SERVICE_API_KEY="cortex/athenasec-service-api-key"

# Cortex Play Framework secret used for application/session security.
CORTEX_PLAY_SECRET="cortex/play-secret"

# ------------------------------------------------------------------
# MISP
# ------------------------------------------------------------------

# MISP-generated Auth Key used by AthenaSec to communicate with MISP.
MISP_ATHENASEC_SERVICE_AUTH_KEY="misp/athenasec-service-auth-key"

# MISP application encryption key.
MISP_ENCRYPTION_KEY="misp/encryption-key"

# MISP MariaDB application user password.
MISP_MYSQL_PASSWORD="misp/mysql-password"

# MISP MariaDB root password.
MISP_MYSQL_ROOT_PASSWORD="misp/mysql-root-password"

# MISP Redis password.
MISP_REDIS_PASSWORD="misp/redis-password"

# ---------------------------------------------------------------------------
# INTERNAL BOOTSTRAP ADMINISTRATION
# ---------------------------------------------------------------------------
# These credentials are used only by the AthenaSec installer to initialize
# underlying services and create permanent least-privilege service identities.
# They are not normal AthenaSec human accounts.

CORTEX_BOOTSTRAP_ADMIN_PASSWORD="internal/cortex-bootstrap-admin-password"
CORTEX_BOOTSTRAP_ADMIN_API_KEY="internal/cortex-bootstrap-admin-api-key"

MISP_BOOTSTRAP_ADMIN_PASSWORD="internal/misp-bootstrap-admin-password"
MISP_BOOTSTRAP_ADMIN_AUTH_KEY="internal/misp-bootstrap-admin-auth-key"

# ------------------------------------------------------------------
# AthenaSec Internal
# ------------------------------------------------------------------

# Reserved for credentials owned directly by AthenaSec itself.
# Specific internal secrets will be added only when their purpose
# becomes defined by the backend/agent architecture.
ATHENASEC_INTERNAL_SECRET_DIR="internal"

